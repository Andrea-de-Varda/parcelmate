        --alternative_forms always --seed 42 --cft_formats '
      env: PYTHONHASHSEED=0
  patch: random.sample(x, k) -> random.sample(sorted(x), k) at two call sites (Python >= 3.11 compatibility); PYTHONHASHSEED=0; run with python -s -P
