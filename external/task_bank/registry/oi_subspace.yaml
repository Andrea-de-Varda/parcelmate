  n_items_after_validity_and_dedup: 15141
  n_items_converted: 2000
  sampled_ids_file: external/task_bank/tasks/oi_subspace/oi_sell.ids.txt
  sampling_rule: proportional stratified sample, seed 42, cap 2000
  adaptations:
  - 'query cut before the object: prompt = context + " Person <Name> <verb phrase> the", answer " <object>"'
  - 'flip (our construction): exchange the person names of the queried clause and one other clause (random.Random("42:<task>:<row>")); query unchanged; token permutation, equal length by construction'
  - random common words as objects (the paper uses them to avoid semantic cues), so answers are often not intuitive nouns
  - rows whose context repeats a person name or an object (259 of 15400) are dropped because the binding is ambiguous
