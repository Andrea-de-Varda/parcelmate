tasks:
- name: ioi_eapig_gpt2
  family: ioi
  domain: syntax/semantics (name movement)
  n_items_raw: 1000
  n_items_after_validity_and_dedup: 1000
  n_items_converted: 1000
  sampling_rule: all items kept
  adaptations:
  - 'data/ioi/gpt2.csv of eap-ig-faithfulness (1,000 items from the Wang et al. generator, filtered so names are single GPT-2 tokens). The CSV has `corrupted` (ABC: S2 replaced by a third name; the answer
    does not flip) and `corrupted_hard` (S2 replaced by the IO name, so IO and S exchange roles). We use `corrupted_hard` as the corrupted prompt: this is the flipping variant. Answers decoded from correct_idx/incorrect_idx
    (asserted equal to the names in the text).'
  - The ABC `corrupted` column is not used (no flip).
  len_match_share_qwen35: 1.0
  n_len_match: 1000
  single_token_answers_share: 1.0
  equal_answer_token_count_share: 1.0
- name: ioi_eapig_llama
  family: ioi
  domain: syntax/semantics (name movement)
  n_items_raw: 499
  n_items_after_validity_and_dedup: 499
  n_items_converted: 499
  sampling_rule: all items kept
  adaptations:
  - ioi_llama.csv of the hannamw/EAP-IG repo (499 rows; names single tokens for the Llama tokenizer, ids are Llama ids and are not used); answers recovered from the text (name written in place of S2 in
    `corrupted_hard`). Same structure and template family as ioi_eapig_gpt2, different item sample.
  len_match_share_qwen35: 1.0
  n_len_match: 499
  single_token_answers_share: 1.0
  equal_answer_token_count_share: 1.0
- name: gender_bias
  family: gender_pronoun
  domain: social/bias (stereotyped pronoun)
  n_items_raw: 986
  n_items_after_validity_and_dedup: 986
  n_items_converted: 986
  sampling_rule: all items kept
  adaptations:
  - data/gender-bias/gpt2.csv (986 items). Clean = stereotyped profession ("The nurse said that"); corrupted = a gendered noun ("The man ..."); answers are the pronoun tokens decoded from clean_answer_idx
    / corrupted_answer_idx with GPT-2 (e.g. " she"/" he"); they differ in every kept item, so the flip is natural. "Correct" is stereotype-defined, not grammatical.
  len_match_share_qwen35: 0.9574
  n_len_match: 944
  single_token_answers_share: 1.0
  equal_answer_token_count_share: 1.0
- name: capital_country
  family: factual_capital
  domain: factual knowledge (capital -> country)
  n_items_raw: 190
  n_items_after_validity_and_dedup: 190
  n_items_converted: 190
  sampling_rule: all items kept
  adaptations:
  - 'data/fact-retrieval-comma/gpt2.csv (190 items): " Kabul, the capital of" -> " Afghanistan"; the corrupted prompt uses another capital. The source scores the FIRST GPT-2 token of the country (country_idx,
    e.g. " United" for "United Kingdom"); we use the full country name with a leading space as the answer (multi-token answers are allowed), and keep the first-token string in metadata. Answer token counts
    can differ between clean and corrupted answer, which biases summed log-probabilities slightly.'
  - 'Country -> capital direction: not in the repo (the repo only contains capital -> country, "fact-retrieval-comma"); not built.'
  len_match_share_qwen35: 0.7211
  n_len_match: 137
  single_token_answers_share: 0.4053
  equal_answer_token_count_share: 0.4789
- name: hypernymy_comma
  family: hypernymy
  domain: lexical semantics (hypernym completion)
  n_items_raw: 198
  n_items_after_validity_and_dedup: 198
  n_items_converted: 198
  sampling_rule: all items kept
  adaptations:
  - 'data/hypernymy-comma/gpt2.csv (198 items), prompt ", gemstones and other" (the source `clean`/`corrupted` columns; note the leading comma). Each item has a SET of acceptable answers; the source metric
    sums probability over the set. Tier 1 needs one answer: we take the first listed answer (token decoded from answers_idx, leading space) that is not in the other item''s answer set, for the clean and
    for the corrupted item; the order of the lists is as in the source and its principle is not documented. Full sets kept in metadata.'
  - Source reports a low GPT-2 baseline for this task (prob_diff mean about 0.2).
  len_match_share_qwen35: 0.8636
  n_len_match: 171
  single_token_answers_share: 1.0
  equal_answer_token_count_share: 1.0
- name: hypernymy_type_of
  family: hypernymy
  domain: lexical semantics (hypernym completion)
  n_items_raw: 198
  n_items_after_validity_and_dedup: 198
  n_items_converted: 198
  sampling_rule: all items kept
  adaptations:
  - 'data/hypernymy-comma/gpt2.csv (198 items), prompt "gemstones are a type of" (the source `clean2`/`corrupted2` columns). Each item has a SET of acceptable answers; the source metric sums probability
    over the set. Tier 1 needs one answer: we take the first listed answer (token decoded from answers_idx, leading space) that is not in the other item''s answer set, for the clean and for the corrupted
    item; the order of the lists is as in the source and its principle is not documented. Full sets kept in metadata.'
  - Source reports a low GPT-2 baseline for this task (prob_diff mean about 0.2).
  len_match_share_qwen35: 0.4899
  n_len_match: 97
  single_token_answers_share: 1.0
  equal_answer_token_count_share: 1.0
- name: sva
  family: sva
  domain: syntax (subject-verb agreement)
  n_items_raw: 12400
  n_items_after_validity_and_dedup: 10660
  n_items_converted: 2000
  sampling_rule: proportional stratified sample, seed 42, cap 2000
  adaptations:
  - data/sva/gpt2.csv (12,400 items, 15 Marvin & Linzen-style structures `group`, half plural-clean, half singular-clean; clean/corrupted differ by the number of one noun, filtered to equal GPT-2 length).
    The source metric sums logit/prob over a whole list of singular vs plural verbs (data/sva/combined_verb_list.csv); the CSV has no single answer word.
  - 'OUR ADAPTATION: answer pair " is"/" are" for all structures (plural clean -> " are" correct). Not a perfect fit for the `within` groups (next word is the embedded verb) and vp_coord groups (next word
    is a verb after "and"); the `group` field allows restricting to structures where an auxiliary is natural (simple_agrmt, prep_*, subj_rel, obj_rel_across_*, obj_rel_no_comp_across_*, sent_comp).'
  - 'RESTRICTED (2026-10-12): the `within` and vp_coord groups are excluded, since the remaining pool exceeds the 2,000-item cap.'
  - Pooled across groups, stratified by group x clean number. Rows come from the gpt2-filtered CSV; pythia.csv (different filtered subset) not converted. The raw template data (sva_raw_data) also contain
    BLiMP files, not converted (BLiMP is covered by group 2).
  - Matching of the repo-level `gpt2 copy.csv` ignored (stray duplicate).
  len_match_share_qwen35: 1.0
  n_len_match: 2000
  single_token_answers_share: 1.0
  equal_answer_token_count_share: 1.0
- name: greater_than
  family: greater_than
  domain: arithmetic/comparison
