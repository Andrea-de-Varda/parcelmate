  - 'Generator `_generate_balanced_svn_cases(samples_per_perm=5, seed=42)`: pronoun or name subjects (singular vs "X and Y" plural), optional time prefix, regular verbs (walks/walk ...), irregular (goes/go,
    eats/eat, has/have, is/are, was/were). The prompt ends right before the verb; answer = verb form with leading space.'
