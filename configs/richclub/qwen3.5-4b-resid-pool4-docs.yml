# Rich-club stage (LOG.md Iteration 45, info/RICH_CLUB_PLAN.md): Qwen/Qwen3.5-4B, all 294912 MLP
# neurons, the POOLED RESIDUAL connectome of Iteration 43 (four prose datasets; half A = sample 1
# of each, half B = sample 2; each half the Fisher mean over its four samples). Generated by
# scripts/make_richclub_configs.py; edit that script, not this file.
#
# The tiles are KEPT (173.9 GB per half, 695.8 GB for 2 trees x 2 halves): the network-
# neuroscience stages read the connectome itself. Document-coherent text (Iteration 48): wikitext and bookcorpus as windows of
# contiguous text, agnews and tldr17 with the end-of-text token between documents.
# Full pipeline in this tree.
output_dir: results/richclub/qwen3.5-4b-resid-pool4-docs
seed: 42
purge_connectivity: false
connectivity:
  model_name: Qwen/Qwen3.5-4B
  revision: null
  unit_type: mlp
  units_per_layer: null
  n_samples: 2
  domains:
  - wikitext
  - bookcorpus
  - agnews
  - tldr17
  seq_len: 1024
  n_tokens: 102400
  split: train
  take: 100000
  wrap: true
  shuffle: true
  batch_size: 8
  highpass: null
  lowpass: null
  step: 0.2
  timecourse_pca_components: null
  timecourse_ica_components: null
  eps: 0.001
  null_model: circshift
  n_surrogates: 0
  outputs:
  - halves
  storage: tiled_fp16
  residualize: token_position
  residual_ref_tokens: null
  residual_min_count: 3
  pool_as: pooled
  data_kwargs:
    sampling: documents
parcellation:
  n_networks: 100
  n_samples: 200
  clustering: kmeans
  binarize_connectivity: false
  fisher_transform: true
  standardize_profiles: true
  sparsify_profiles: true
  connectivity_pca_components: 100
  pca_whiten: false
  store_samples: true
  parcellate_keys:
  - halfA
  - halfB
  clustering_kwargs: null
  n_alignments: null
  weight_samples: false
  parcellate_samples: false
parcellation_variants:
  final: {}
score:
  domains:
  - pooled
