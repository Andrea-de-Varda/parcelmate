# Qwen/Qwen3.5-2B, all 24 x 6144 = 147456 MLP neurons, POOLED over 5
# domains (LOG.md Iteration 31). Generated by scripts/make_qwen_configs.py; edit that
# script, not this file.
#
# One pseudo-domain `pooled`: half A = sample 1 of every domain, half B = sample 2, each
# sample 40960 tokens and z-scored on its own, each half the Fisher mean over its 5
# samples. For comparison with the patching circuits only (independent localiser, so
# pooling is no double dipping); the domain-generality results stay single-domain. 43 GB
# per half, 174 GB written for 2 trees x 2 halves, purged after scoring. Everything
# else is the confirmed pipeline (Iteration 21).
output_dir: results/qwen35/qwen3.5-2b-pool5
seed: 42
purge_connectivity: true
connectivity:
  model_name: Qwen/Qwen3.5-2B
  revision: null
  unit_type: mlp
  units_per_layer: null
  n_samples: 2
  domains:
  - wikitext
  - bookcorpus
  - agnews
  - tldr17
  - codeparrot
  seq_len: 1024
  n_tokens: 40960
  split: train
  take: 100000
  wrap: true
  shuffle: true
  batch_size: 8
  highpass: null
  lowpass: null
  step: 0.2
  timecourse_pca_components: null
  timecourse_ica_components: null
  eps: 0.001
  null_model: circshift
  n_surrogates: 0
  outputs:
  - halves
  storage: tiled_fp16
  pool_as: pooled
parcellation:
  n_networks: 100
  n_samples: 200
  clustering: kmeans
  binarize_connectivity: false
  fisher_transform: true
  standardize_profiles: true
  sparsify_profiles: true
  connectivity_pca_components: 100
  pca_whiten: false
  store_samples: true
  parcellate_keys:
  - halfA
  - halfB
  clustering_kwargs: null
  n_alignments: null
  weight_samples: false
  parcellate_samples: false
parcellation_variants:
  final: {}
score:
  domains:
  - pooled
