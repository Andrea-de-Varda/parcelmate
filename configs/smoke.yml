# Minimal smoke-test run: GPT-2, two domains, tiny token budget.
# Purpose is to verify the cluster environment end to end in a few minutes,
# NOT to produce usable results.
# Consumed by `python -m parcelmate.bin.main configs/gpt2.yml -s <steps>`.
# Every value below is written out explicitly (most match the code defaults) so
# that the config alone documents the run for the paper's methods section.

output_dir: results/smoke

# Master seed; see configs/gpt2.yml for how sub-seeds are derived.
seed: 42

connectivity:
  model_name: gpt2
  # Independent samples averaged (Fisher-z) into the final connectivity matrix.
  n_samples: 1
  domains:
    - wikitext
    - bookcorpus
  seq_len: 1024
  n_tokens: 5000
  split: train
  take: 2000
  wrap: true
  shuffle: true
  batch_size: 8
  # Temporal filtering of unit timecourses (null = off).
  highpass: null
  lowpass: null
  step: 0.2
  # Optional dimensionality reduction of timecourses before correlation.
  timecourse_pca_components: null
  timecourse_ica_components: null
  eps: 1.0e-3

parcellation:
  n_networks: 50              # k for MiniBatchKMeans
  n_samples: 10
  binarize_connectivity: true # threshold |r| at each unit's 90th percentile
  connectivity_pca_components: 50
  connectivity_ica_components: null
  clustering_kwargs: null
  n_alignments: null
  weight_samples: false       # LOG.md S5 — fixed, but leave off
  parcellate_samples: false   # LOG.md M4 — parcellate only the sample-averaged connectivity

# Knockout is opt-in (LOG.md S1). With `networks` unset this step is a no-op, so `-s all`
# never silently lesions the model. Set `networks: all` (or a list like [0, 3, 7]) to build
# one perturbed model per shared subnetwork and re-measure connectivity for each.
#   ablation: mean  -> replace lesioned units with their mean activation under the domain
#                      being processed, read from this run's baseline unit_means. On
#                      distribution, unlike zero.
#   ablation: zero  -> clamp to zero (the original behaviour; off-distribution, so a deficit
#                      conflates "network removed" with "input broken").
# Cost warning: this is one full connectivity run per selected network.
# NOTE: no matched random-lesion controls exist yet, so a deficit here is not yet
# interpretable on its own. Deliberately deferred.
subnetwork_knockout:
  networks: null
  ablation: mean
  knockout_thresh: 0.5
  steps:
    - plot_stability

# `model_name` is inherited from the `connectivity` section above and must not be set here:
# a lesioned run has to use the same model as the baseline it is compared against.
