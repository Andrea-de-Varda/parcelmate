   <g id="text_1">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8b2f33" x="9.5715" y="18.981" transform="rotate(-0 9.5715 18.981)">Attribution patching  (task circuits)</text>
   </g>
   <g id="text_2">
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'" transform="translate(16.278844 45.638972)">46 minimal-pair tasks</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'" transform="translate(15.271617 54.037331)">4 domains: Language,</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'" transform="translate(13.077281 62.435691)">Formal, Social, Physical</text>
   </g>
   <g id="text_3">
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'" transform="translate(134.477836 45.638972)">attribution of every</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'" transform="translate(148.866703 54.037331)">MLP neuron</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'" transform="translate(128.012016 62.435691)">(activation × gradient)</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'" transform="translate(250.764328 45.638972)">circuit = top 0.1%</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'" transform="translate(259.143234 54.037331)">of all neurons</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'" transform="translate(242.819016 62.435691)">(147 at 2B, 294 at 4B)</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f4e79" x="9.5715" y="117.9414" transform="rotate(-0 9.5715 117.9414)">Connectivity  (networks)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'" transform="translate(10.686656 144.599372)">ordinary text, 5 datasets</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'" transform="translate(24.34193 152.997731)">(4 prose + code),</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'" transform="translate(24.218297 161.396091)">no tasks involved</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'" transform="translate(130.061625 144.475388)">activation timecourse</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'" transform="translate(132.272953 152.873747)">of every MLP neuron</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'" transform="translate(138.035648 161.311481)">→ |r| connectome</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'" transform="translate(251.436398 144.599372)">k = 100 networks</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'" transform="translate(243.588937 152.997731)">(k-means, consensus)</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'" transform="translate(244.14675 161.396091)">per dataset or pooled</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(377.85857 84.757187)">Do circuits and networks</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(380.427164 94.275328)">find the same neurons?</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(430.51275 103.793469)"/>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(372.645016 113.311609)">concentration · enrichment</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(376.288727 122.82975)">shared structure · graded</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #4c4c4c" transform="translate(360.5535 184.521506)">references:</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #4c4c4c" transform="translate(360.5535 192.359975)">• random neurons with the circuit's per-layer counts</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #4c4c4c" transform="translate(360.5535 200.198444)">• null partition: same pipeline on time-shifted</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #4c4c4c" transform="translate(360.5535 208.036912)">   activations (keeps neuron properties, no co-activation)</text>
   </g>
  </g>
 </g>
